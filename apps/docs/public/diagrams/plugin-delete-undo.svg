<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1580" viewBox="0 0 960 1580" role="img" aria-labelledby="title desc">
<title id="title">删除与撤销插件操作流程</title><desc id="desc">安装插件后，通过右键菜单选择删除目标，执行命令并检查提交策略。拒绝时保持原文，允许时记录历史并通知界面。撤销同样经过提交策略。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs>
<rect width="960" height="1580" rx="20" fill="#f8fafc"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<text x="40" y="47" font-size="26" font-weight="700" fill="#0f172a">删除与撤销 · 插件操作流程</text>
<text x="40" y="77" font-size="16" fill="#475569">菜单负责交互，命令承载操作，Editor 负责提交与历史</text><rect x="160" y="105" width="640" height="78" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="480.0" y="140.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">安装 core.ops</text><text x="480.0" y="167.0" text-anchor="middle" font-size="14" fill="#475569">注册命令、右键菜单和工具栏入口</text><path d="M480 183V210" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="160" y="212" width="640" height="65" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="480.0" y="250.5" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">用户右键点击“删除”</text><path d="M480 277V308" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480 310L675 370L480 430L285 370Z" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="480" y="376" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">点击块在选择集中？</text><path d="M285 370H220V463" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="240" y="355" font-size="15" fill="#475569">是</text><path d="M675 370H740V463" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="705" y="355" font-size="15" fill="#475569">否</text><rect x="70" y="465" width="300" height="65" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="220.0" y="503.5" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">目标：整个选择集</text><rect x="590" y="465" width="300" height="65" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="740.0" y="503.5" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">目标：点击的单个块</text><path d="M220 530V550H480V577" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M740 530V550H480" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="160" y="580" width="640" height="80" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="480.0" y="616.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">editor.execute(commandId, ids)</text><text x="480.0" y="643.0" text-anchor="middle" font-size="14" fill="#475569">命令校验 → command:before → 命令处理器</text><path d="M480 660V687" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="160" y="690" width="640" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="480.0" y="725.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">editor.remove(ids)</text><text x="480.0" y="752.0" text-anchor="middle" font-size="14" fill="#475569">写权限检查 → 正文校验</text><path d="M480 768V795" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="160" y="798" width="640" height="70" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="480.0" y="829.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">transaction:beforeCommit</text><text x="480.0" y="856.0" text-anchor="middle" font-size="14" fill="#475569">提交策略检查</text><path d="M800 833H855V903" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="820" y="817" font-size="15" fill="#475569">拒绝</text><rect x="735" y="906" width="200" height="104" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/><text x="835.0" y="954.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">保留原文与历史</text><text x="835.0" y="981.0" text-anchor="middle" font-size="14" fill="#475569">rolledBack → command:error</text><path d="M480 868V903" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="493" y="891" font-size="15" fill="#475569">允许</text><rect x="160" y="906" width="510" height="80" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="415.0" y="942.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">更新正文与历史</text><text x="415.0" y="969.0" text-anchor="middle" font-size="14" fill="#475569">transaction:committed</text><path d="M415 986V1013" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="160" y="1016" width="510" height="80" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="415.0" y="1052.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">通知界面与观察者</text><text x="415.0" y="1079.0" text-anchor="middle" font-size="14" fill="#475569">change / selection / history → command:after</text><path d="M415 1096V1123" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="160" y="1126" width="510" height="78" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="415.0" y="1161.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">用户点击“撤销”</text><text x="415.0" y="1188.0" text-anchor="middle" font-size="14" fill="#475569">撤销命令 → editor.undo()</text><path d="M415 1204V1231" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="160" y="1234" width="510" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="415.0" y="1265.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">transaction:beforeCommit</text><text x="415.0" y="1292.0" text-anchor="middle" font-size="14" fill="#475569">撤销也要经过提交策略</text><path d="M670 1269H835V1319" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="700" y="1253" font-size="15" fill="#475569">拒绝</text><rect x="735" y="1322" width="200" height="78" rx="12" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/><text x="835.0" y="1357.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">保持删除后状态</text><text x="835.0" y="1384.0" text-anchor="middle" font-size="14" fill="#475569">历史栈不移动</text><path d="M415 1304V1341" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="430" y="1328" font-size="15" fill="#475569">允许</text><rect x="160" y="1344" width="510" height="80" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="415.0" y="1380.0" text-anchor="middle" font-size="18" font-weight="600" fill="#0f172a">恢复删除前快照</text><text x="415.0" y="1407.0" text-anchor="middle" font-size="14" fill="#475569">移动历史栈 → 提交通知 → 界面更新</text><text x="40" y="1480" font-size="15" fill="#475569">阅读提示：红色分支表示策略拒绝；蓝色表示交互或扩展入口。</text><text x="40" y="1510" font-size="15" fill="#475569">command:before 拒绝或命令校验失败时，直接进入 command:error，不执行删除。</text><text x="40" y="1540" font-size="15" fill="#475569">删除最后一个块时，Editor 自动保留一个空段落。</text></g></svg>