<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img" aria-labelledby="title"><title id="title">插件管理器与扩展职责</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="960" height="660" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, sans-serif"><text x="32" y="44" font-size="24" font-weight="700" fill="#0f172a">插件管理器与扩展职责</text><rect x="30" y="90" width="180" height="70" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="120.0" y="131.0" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="600">依赖预检</text><path d="M210 125H265" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="270" y="90" width="180" height="70" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="360.0" y="131.0" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="600">安装插件</text><path d="M450 125H505" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="510" y="90" width="180" height="70" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="600.0" y="131.0" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="600">持有作用域</text><path d="M690 125H745" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="750" y="90" width="180" height="70" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="840.0" y="131.0" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="600">卸载 / 回滚</text><path d="M600 160V205H480V235" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="270" y="240" width="420" height="75" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="480.0" y="274.5" text-anchor="middle" fill="#0f172a" font