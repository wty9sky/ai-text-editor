<svg xmlns="http://www.w3.org/2000/svg" width="900" height="780" viewBox="0 0 900 780" role="img" aria-labelledby="title"><title id="title">SDK 生命周期状态</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="900" height="780" rx="18" fill="#f8fafc"/><g font-family="system-ui, -apple-system, sans-serif"><text x="32" y="44" font-size="24" font-weight="700" fill="#0f172a">SDK 生命周期状态</text><circle cx="340" cy="88" r="9" fill="#334155"/><path d="M340 98V125" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="90" y="130" width="500" height="95" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="340.0" y="174.5" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="600">initializing</text><text x="340.0" y="202.5" text-anchor="middle" fill="#475569" font-size="15">建立数据、预检依赖与同步安装插件</text><path d="M340 225V303" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="355" y="270" fill="#475569" font-size="15">初始化成功</text><rect x="90" y="308" width="500" height="90" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/><text x="340.0" y="350.0" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="600">ready</text><text x="340.0" y="378.0" text-anchor="middle" fill="#475569" font-size="15">编辑、执行命令与动态安装 / 卸载插件</text><path d="M340 398V480" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="355" y="445" fill="#475569" font-size="15">destroy()</text><path d="M590 177H700V527H595" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="716" y="345" fill="#475569" font-size="15">初始化失败</text><rect x="90" y="485" width="500" height="95" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="340.0" y="529.5" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="600">destroying</text><text x="340.0" y="557.5" text-anchor="middle" fill="#475569" font-size="15">取消会话、逆序卸载、清理资源</text><path d="M340 580V658" fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="355" y="625" fill="#475569" font-size="15">完成清理（包含异常汇总）</text><rect x="90" y="663" width="500" height="85" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="340.0" y="702.5" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="600">destroyed</text><text x="340.0" y="730.5" text-anchor="middle" fill="#475569" font-size="15">停止写入；重复 destroy() 无操作</text></g></svg>